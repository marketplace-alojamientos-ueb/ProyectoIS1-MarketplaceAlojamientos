spring.application.name=marketplace
server.port=8080

# Para que las respuestas de error incluyan el mensaje ("message") y los errores de validación ("errors")
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- Base de datos (MySQL) ----------
# El esquema se crea con database/scripts.sql; Hibernate no modifica tablas.
# Cada quien configura su usuario/contraseña con variables de entorno DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Correo (recuperación de contraseña) ----------
# Mientras no se configure, el código de recuperación se imprime en la consola del backend.
# Para enviar correos reales (ej. Gmail con contraseña de aplicación) descomentar:
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.correo.remitente=${MAIL_USERNAME:no-reply@marketplace.local}

# Minutos de validez del código de recuperación de contraseña (se guarda en memoria, no en la BD)
app.recuperacion.minutos-expiracion=15
