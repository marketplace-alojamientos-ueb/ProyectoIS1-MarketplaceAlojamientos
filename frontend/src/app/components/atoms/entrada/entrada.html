<input
  [id]="id()"
  [type]="tipo()"
  [formControl]="control()"
  [placeholder]="placeholder()"
  [attr.autocomplete]="autocomplete()"
  [attr.inputmode]="modoTeclado()"
  [attr.aria-label]="etiqueta() || null"
  [attr.aria-invalid]="invalida()"
  [attr.aria-describedby]="id() + '-texto'"
  [class.invalida]="invalida()"
/>
