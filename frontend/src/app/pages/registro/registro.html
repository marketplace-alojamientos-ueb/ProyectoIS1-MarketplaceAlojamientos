<app-plantilla-autenticacion
  titulo="Regístrate como anfitrión"
  subtitulo="Crea tu cuenta para empezar a publicar alojamientos"
  [amplia]="true"
>
  @if (registrado()) {
    <app-alerta tipo="exito">
      ¡Listo, {{ registrado() }}! Tu cuenta fue creada. Ahora inicia sesión.
      (Prototipo: no se guardó en el back.)
    </app-alerta>
    <app-boton [completo]="true" (click)="irALogin()">Ir a iniciar sesión</app-boton>
  } @else {
    <app-formulario-registro (enviar)="registrar($event)" />
  }
</app-plantilla-autenticacion>
