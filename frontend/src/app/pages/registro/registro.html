<app-plantilla-autenticacion [titulo]="titulo()" [subtitulo]="subtitulo()" [amplia]="true">
  @if (registrado()) {
    <app-alerta tipo="exito">
      ¡Listo, {{ registrado() }}! Tu cuenta fue creada. Ahora inicia sesión.
    </app-alerta>
    <app-boton [completo]="true" (click)="irALogin()">Ir a iniciar sesión</app-boton>
  } @else {
    <app-selector-rol id="registro-rol" [rol]="rol()" (rolChange)="cambiarRol($event)" />
    @if (error()) {
      <app-alerta tipo="error">{{ error() }}</app-alerta>
    }
    <app-formulario-registro [cargando]="cargando()" (enviar)="registrar($event)" />
  }
</app-plantilla-autenticacion>
