name: CI - Marketplace Alojamientos

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 y Maven
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar, ejecutar pruebas y generar cobertura
        run: >
          mvn --batch-mode --no-transfer-progress
          -f backend/pom.xml
          org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:0.8.15:report

      # SonarCloud analiza back y front juntos, así que aquí también se genera la cobertura del front
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ejecutar pruebas del frontend y generar cobertura
        working-directory: frontend
        run: |
          npm ci
          npm run test:cobertura
          sed -i 's#^SF:#SF:frontend/#' coverage/frontend/lcov.info

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

  frontend:
    name: Frontend - Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build