name: CI - Marketplace Alojamientos

# PR de una rama a QA: compila y ejecuta las pruebas del back y del front (jobs "QA").
# PR de QA a main y push a main: solo el análisis de SonarCloud (job "main").
# El push a main se mantiene para que SonarCloud tenga el análisis de la rama principal con el que compara los PR.
on:
  pull_request:
    branches:
      - QA
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: QA - Backend (Java 21 y Maven)
    # base_ref es la rama destino del PR
    if: github.base_ref == 'QA'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

  frontend:
    name: QA - Frontend (Angular)
    if: github.base_ref == 'QA'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  sonar:
    name: main - SonarCloud
    # ref es la rama en un push
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # SonarCloud no ejecuta pruebas: lee la cobertura que generan aquí las pruebas del back y del front
      - name: Generar cobertura del backend
        run: >
          mvn --batch-mode --no-transfer-progress
          -f backend/pom.xml
          org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:0.8.15:report

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generar cobertura del frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:cobertura
          sed -i 's#^SF:#SF:frontend/#' coverage/frontend/lcov.info

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info
